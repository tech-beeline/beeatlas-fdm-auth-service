app.version=@project.version@
app.name=@project.name@
server.max-http-header-size=1MB
server.max-http-request-header-size=1MB

spring.jpa.hibernate.ddl-auto=none
springdoc.packages-to-scan=ru.beeline.fdmauth.controller
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.doc-expansion=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
#spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.default_schema=user_auth
spring.flyway.default-schema=user_auth
spring.flyway.baseline-on-migrate = true
spring.flyway.clean-disabled=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=fdm-auth-pool
spring.datasource.hikari.leak-detection-threshold=5000

fdm-auth.kafka.enabled=false
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.consumer.auto-offset-reset: earliest
spring.kafka.consumer.key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.properties.specific.avro.reader=false
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.login.callback.handler.class=io.strimzi.kafka.oauth.client.JaasClientOauthLoginCallbackHandler
spring.kafka.properties.sasl.mechanism=OAUTHBEARER
spring.kafka.properties.bearer.auth.credentials.source=CUSTOM
spring.kafka.properties.bearer.auth.custom.provider.class=ru.beeline.fdmauth.config.OAuthSchemaRegistryCredentialProvider


management.metrics.web.server.auto-time-requests=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true

logging.level.io.opentelemetry.exporter.internal.http.HttpExporter=ERROR

otel.exporter.otlp.endpoint=http://otel-collector.opentelemetry:4318
otel.exporter.otlp.protocol=http/protobuf
otel.resource.attributes.host.name=@project.name@
otel.resource.attributes.service.namespace=@project.name@
otel.service.name=@project.name@
otel.instrumentation.log4j-appender.enabled=true
otel.logs.exporter=none
otel.sdk.disabled=true